<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Portfólio</title>
    <link rel="stylesheet" href="styles/main.css">
</head>
<body>
    <!-- Vídeo de introdução para mobile -->
    <div id="intro-video-mobile">
        <video 
            autoplay 
            muted 
            playsinline 
            id="intro-canva" 
            onended="window.location.href='main.html';"
            style="width: 100%; max-width: 100%; height: auto;"
        >
            <source src="images/intro-canva.mp4" type="video/mp4">
            Seu navegador não suporta vídeos.
        </video>
    </div>

    <!-- Conteúdo principal (aparecerá após a transição) -->
    <div id="main-content" style="display: none;">
        <h1>Bem-vindo ao Meu Portfólio!</h1>
        <p>Esta é a página principal.</p>
    </div>

    <script>
        // Exibe o conteúdo principal se o vídeo não carregar
        document.getElementById('intro-canva').addEventListener('error', () => {
            document.getElementById('intro-video-mobile').style.display = 'none';
            document.getElementById('main-content').style.display = 'block';
        });
    </script>
</body>
</html>
