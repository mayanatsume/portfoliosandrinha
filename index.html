<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1200, initial-scale=0.4, maximum-scale=2, user-scalable=yes">
    <title>Meu Portfólio</title>
    <link rel="stylesheet" href="styles/main.css">
    <link rel="stylesheet" href="styles/intro.css"> <!-- Estilo adicional para animação de imagem -->
</head>
<body>
    <!-- Tela de introdução para dispositivos móveis -->
    <div id="intro-screen-mobile" style="display: none;">
        <img src="images/intro-image.jpg" alt="Minha Introdução">
    </div>

    <!-- Vídeo de introdução para computadores -->
    <div id="intro-video-mobile">
        <video 
            autoplay 
            muted 
            playsinline 
            id="intro-canva" 
            onended="window.location.href='main.html';"
            style="width: 100%; max-width: 100%; height: auto;"
        >
            <source src="images/intro-canva.mp4" type="video/mp4">
            Seu navegador não suporta vídeos.
        </video>
    </div>

    <script src="scripts/intro.js"></script>
</body>
</html>
