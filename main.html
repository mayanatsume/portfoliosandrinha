<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <!-- Ajuste a viewport como preferir. Se quiser brute force, use width=1200. -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portfólio Sandrinha</title>
  <link rel="stylesheet" href="main.css">
</head>
<body>

  <!-- SEÇÃO DE INTRO (VÍDEO) -->
  <section id="intro">
    <video 
      id="introVideo"
      autoplay
      muted
      playsinline
      loop
      preload="auto"
      style="width: 100%; height: auto; object-fit: cover;"
    >
      <source src="intro-canva.mp4" type="video/mp4">
      <!-- Se quiser, coloque um fallback de texto ou imagem aqui. -->
    </video>
  </section>

  <!-- CABEÇALHO (LOGO + LINKS) -->
  <header id="menu">
    <div class="logo">
      <img src="images/logo.png" alt="Logo">
    </div>
    <nav class="nav-links">
      <a href="#sobre">Sobre</a>
      <a href="#servicos">Serviços</a>
      <a href="#portfolio">Portfólio</a>
      <a href="#investir">Investir</a>
    </nav>
  </header>

  <!-- SEÇÃO SOBRE (Imagem de fundo) -->
  <section id="sobre">
    <h2>Sobre</h2>
    <p>Texto sobre...</p>
  </section>

  <!-- BOTÕES DE CONTATO (abaixo da seção "Sobre") -->
  <section id="contatos">
    <a href="tel:+351919736324" class="phone-btn">
      <img src="images/phone-icon.png" alt="Telefone">
    </a>
    <a href="mailto:elisandrapersonalorganaize@gmail.com" class="email-btn">
      <img src="images/email-icon.png" alt="Email">
    </a>
    <a href="https://www.instagram.com/elisandrapersonalorganaize" class="instagram-btn">
      <img src="images/instagram-icon.png" alt="Instagram">
    </a>
  </section>

  <!-- SEÇÃO PORTFÓLIO (Caixinhas ocupando 100% e deslizando) -->
  <section id="portfolio">
    <h2>Portfólio</h2>

    <div class="portfolio-grid">
      <div class="portfolio-item despensa">
        <span>Despensa</span>
      </div>
      <div class="portfolio-item quarto">
        <span>Quarto</span>
      </div>
      <div class="portfolio-item banheiro">
        <span>Banheiro</span>
      </div>
      <div class="portfolio-item cozinha">
        <span>Cozinha</span>
      </div>
      <div class="portfolio-item sala">
        <span>Sala</span>
      </div>
      <div class="portfolio-item guarda-roupa">
        <span>Roupeiro</span>
      </div>
    </div>
  </section>

  <!-- SEÇÃO SERVIÇOS -->
  <section id="servicos">
    <h2>Serviços</h2>
    <p>Descrição...</p>
  </section>

  <!-- SEÇÃO INVESTIR -->
  <section id="investir">
    <h2>Investir</h2>
    <p>Detalhes...</p>
  </section>

  <!-- Script opcional para fazer as caixinhas "deslizarem" ao aparecer na tela -->
  <script src="main.js"></script>
</body>
</html>
