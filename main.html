<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <!-- FORÇA O LAYOUT DE 1200PX E UM ZOOM INICIAL DE 0.3 (30%) NO CELULAR -->
  <meta name="viewport" content="width=1200, initial-scale=0.4, maximum-scale=2, user-scalable=yes">
  <title>Sandrinha Personal Organizer</title>
  <link href="https://fonts.googleapis.com/css2?family=Pinyon+Script&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Bree+Serif&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Adam+Script&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="main.css">
</head>
<body>
  <!-- Menu Superior -->
  <header id="menu" class="container">
    <div class="logo">
      <img src="images/logo.png" alt="Logo" id="logoImg">
    </div>
    <nav class="nav-links">
      <a href="#sobre">Sobre</a>
      <a href="#servicos">Serviços</a>
      <a href="#portfolio">Portfólio</a>
      <a href="#investir">Investir</a>
    </nav>
  </header>
  <!-- Seção Hero (Topo com Fundo) -->
  <section id="inicio" class="section">
    <div class="hero"></div>
  </section>

  <!-- Frase de Impacto -->
  <section id="impacto" class="section">
    <div class="barra-cinza"></div>
    <h2 class="impact-text">"Organizar não é só empilhar! É liberar espaço para o novo chegar.</h2>
    <h2 class="impact-text">A mente se acalma, o corpo respira, na organização, a vida gira."</h2>
    <h2 class="impact-text">- Sandra Machado</h2>
  </section>

  <!-- Seção Sobre -->
  <section id="sobre" class="section">
    <div class="sobre"></div>
  </section>
 
  <!-- Seção Portfólio -->
  <section id="portfolio" class="section container">
    <h2>Portfólio</h2>
    <div class="portfolio-grid">
      <div class="portfolio-item despensa">
        <span>Despensa</span>
      </div>
      <div class="portfolio-item quarto">
        <span>Quarto</span>
      </div>
      <div class="portfolio-item banheiro">
        <span>Banheiro</span>
      </div>
      <div class="portfolio-item cozinha">
        <span>Cozinha</span>
      </div>
      <div class="portfolio-item sala">
        <span>Sala</span>
      </div>
      <div class="portfolio-item guarda-roupa">
        <span>Roupeiro</span>
      </div>
    </div>

    <!-- Slider (Antes & Depois) -->
    <div class="slider">
      <h3>Antes & Depois</h3>
      <div class="slider-content">
        <img src="images/antes1.JPG" alt="Antes 1">
        <img src="images/depois1.jpg" alt="Depois 1">
        <img src="images/antes2.jpg" alt="Antes 2">
        <img src="images/depois2.jpg" alt="Depois 2">
        <img src="images/antes3.jpg" alt="Antes 3">
      </div>
    </div>
  </section>

  <!-- Seção Serviços -->
  <section id="servicos" class="section">
    <!-- Apenas a imagem de fundo, sem texto -->
  </section>

  <!-- Seção Investimento -->
  <section id="investir" class="section">
        <div class="investment-images" style="background-image: url('images/investimento.jpg');"></div>
  </section>
  <!-- Scripts JS, se houver -->
  <script src="main.js"></script>
</body>
</html>

<section id="barra">
    <p>Contactos</p>
    <div class="contacts">
        <!-- Seus links de telefone, email, instagram etc. -->
        <a href="tel:+351919736324" target="_blank" class="phone-btn">
          <img src="images/phone-icon.png" alt="Telefone">
        </a>
        <a href="mailto:elisandrapersonalorganaize@gmail.com" target="_blank" class="email-btn">
          <img src="images/email-icon.png" alt="Email">
        </a>
        <a href="https://www.instagram.com/elisandrapersonalorganaize" target="_blank" class="instagram-btn">
          <img src="images/instagram-icon.png" alt="Instagram">
        </a>
      </div>
  </section>
